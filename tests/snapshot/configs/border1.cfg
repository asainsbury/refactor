!
version 17.9
service timestamps debug datetime msec
hostname border1
!
vrf definition TENANT1
 rd 65100:1
 address-family ipv4
 exit-address-family
!
vrf definition Mgmt-intf
 address-family ipv4
 exit-address-family
!
banner motd ^C
  Authorised access only
  interface fake-from-banner
^C
!
ip access-list extended EDGE-IN
 10 permit ip any any
!
route-map RM-FROM-LEAF permit 10
route-map RM-TO-ISP permit 10
route-map RM-FROM-ISP permit 10
!
interface Loopback0
 ip address 10.9.9.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 description to mx1 ge-0/0/0
 ip address 203.0.113.1 255.255.255.252
 ip access-group EDGE-IN in
 no ip proxy-arp
!
interface GigabitEthernet0/0/1
 description to leaf1 Eth1/3
 no ip address
!
interface GigabitEthernet0/0/1.100
 encapsulation dot1Q 100
 vrf forwarding TENANT1
 ip address 192.168.100.1 255.255.255.254
 standby version 2
 standby 1 ip 192.168.100.5
!
interface GigabitEthernet0/0/2
 description spare
 shutdown
!
interface GigabitEthernet0
 vrf forwarding Mgmt-intf
 ip address 10.255.0.31 255.255.255.0
!
interface Port-channel1
 description no members
 ip address 198.51.100.1 255.255.255.0
!
router bgp 65100
 bgp router-id 10.9.9.1
 bgp log-neighbor-changes
 bgp bestpath as-path multipath-relax
 no bgp default ipv4-unicast
 neighbor ISP peer-group
 neighbor ISP remote-as 65300
 neighbor ISP description upstream
 neighbor 203.0.113.2 peer-group ISP
 neighbor 198.18.0.1 remote-as 65400
 neighbor 198.18.0.1 shutdown
 !
 address-family ipv4
  neighbor ISP send-community both
  neighbor ISP route-map RM-FROM-ISP in
  neighbor ISP route-map RM-TO-ISP out
  neighbor 203.0.113.2 activate
  maximum-paths 2
 exit-address-family
 !
 address-family ipv4 vrf TENANT1
  neighbor 192.168.100.0 remote-as 65000
  neighbor 192.168.100.0 activate
  neighbor 192.168.100.0 route-map RM-FROM-LEAF in
 exit-address-family
!
end
