!Command: show running-config
version 10.2(5) Bios:version 05.47
hostname leaf1
feature bgp
feature interface-vlan
feature lacp
feature vpc
feature nv overlay
nv overlay evpn
fabric forwarding anycast-gateway-mac 2020.0000.00aa

boot nxos bootflash:/nxos64-cs.10.2.5.M.bin

ip access-list ACL-IN
  10 permit ip any any

route-map RM-TO-BORDER permit 10
route-map RM-FROM-BORDER permit 10

vlan 1,10,20,30,3000
vlan 10
  name WEB
  vn-segment 10010
vlan 20
  name APP
  vn-segment 10020
vlan 30
  name UNUSED
vlan 3000
  name L3VNI-TENANT1
  vn-segment 50000

vrf context TENANT1
  vni 50000
  rd auto

interface Vlan10
  no shutdown
  vrf member TENANT1
  ip address 172.16.10.1/24
  fabric forwarding mode anycast-gateway

interface Vlan20
  vrf member TENANT1
  ip address 172.16.20.1/24
  fabric forwarding mode anycast-gateway
  no shutdown

interface Vlan30
  no shutdown
  ip address 172.16.30.1/24

interface Vlan3000
  no shutdown
  vrf member TENANT1
  ip forward

interface port-channel10
  description vPC to server1
  switchport mode trunk
  switchport trunk allowed vlan 10,20
  vpc 10

interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
  member vni 50000 associate-vrf

interface Ethernet1/1
  description server1 nic1
  switchport mode trunk
  switchport trunk allowed vlan 10,20
  channel-group 10 mode active
  no shutdown

interface Ethernet1/2
  description server2
  switchport
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown

interface Ethernet1/3
  description border1 Gi0/0/1
  no switchport
  no shutdown

interface Ethernet1/3.100
  description border1 tenant1 handoff
  encapsulation dot1q 100
  vrf member TENANT1
  ip address 192.168.100.0/31
  ip access-group ACL-IN in
  no shutdown

interface Ethernet1/49
  description spine1 Eth1/1
  no switchport
  mtu 9216
  ip address 10.0.0.1/31
  no shutdown

interface mgmt0
  vrf member management
  ip address 10.255.0.21/24

interface loopback0
  ip address 10.1.0.11/32

interface loopback1
  ip address 10.2.0.11/32

router bgp 65000
  router-id 10.1.0.11
  address-family ipv4 unicast
    maximum-paths 4
    maximum-paths ibgp 4
  neighbor 10.1.0.1
    remote-as 65000
    description spine1
    update-source loopback0
    address-family l2vpn evpn
      send-community extended
  vrf TENANT1
    address-family ipv4 unicast
      maximum-paths 2
    neighbor 192.168.100.1
      remote-as 65100
      description border1
      address-family ipv4 unicast
        route-map RM-FROM-BORDER in
        route-map RM-TO-BORDER out
        send-community
    neighbor 192.168.200.0/24
      remote-as 65200
      address-family ipv4 unicast
