[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bflite"
version = "0.1.0"
description = "Pure-Python stand-in for Batfish config questions (BGP / L3 / L2) with pybatfish-identical frames"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.3"]
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["bflite*"]
